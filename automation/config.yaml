openstack:
  openrc_path: "./demo-openrc"

health_check:
  expected_status: "ACTIVE"
  target_servers:
    - web-01
    - db-01
    - monitor-01
    - test-01

recovery:
  enabled: true
  wait_seconds: 10
  max_retry: 3

log:
  path: "./logs/vm-health-check.log"
  recovery_path: "./logs/recovery.log"

report:
  path: "./reports"