global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "openstack-host"
    static_configs:
      - targets:
          - "<OPENSTACK_HOST_IP>:9100"

  - job_name: "openstack-vms"
    static_configs:
      - targets:
          - "<WEB_01_PRIVATE_IP>:9100"
          - "<DB_01_PRIVATE_IP>:9100"
          - "<MONITOR_01_PRIVATE_IP>:9100"
          - "<TEST_01_PRIVATE_IP>:9100"