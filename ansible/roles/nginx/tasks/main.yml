- name: Install Nginx

  apt:

    name: nginx

    state: present

- name: Ensure Nginx is running and enabled

  systemd:

    name: nginx

    state: started

    enabled: true

- name: Create custom index page

  copy:

    dest: /var/www/html/index.html

    content: |

      <!DOCTYPE html>

      <html>

      <head>

        <title>OpenStack Private Cloud Lab</title>

      </head>

      <body>

        <h1>OpenStack Private Cloud Lab - web-01</h1>

        <p>This server is managed by Ansible.</p>

      </body>

      </html>

    owner: www-data

    group: www-data

    mode: "0644"